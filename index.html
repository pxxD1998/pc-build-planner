<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0d11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PC Build Planner" />
  <title>PC Build Planner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="back-to-top.css" />
  <link rel="stylesheet" href="mobile-build.css" />
  <link rel="stylesheet" href="saved-builds.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup">
      <h1>PC Build <span>Planner</span></h1>
      <div class="tagline">TAIWAN PC CONFIGURATOR</div>
    </div>
    <div class="meta" id="meta">尚未載入資料</div>
  </header>

  <main class="layout">
    <aside class="categories panel" aria-label="商品分類">
      <div class="category-head">
        <div>
          <div class="eyebrow">CATALOG</div>
          <h2>商品分類</h2>
        </div>
        <span class="category-total" id="categoryTotal">共 0 類</span>
      </div>
      <nav class="category-list" id="categories"></nav>
    </aside>

    <section class="catalog panel">
      <div class="catalog-head">
        <div class="catalog-title-wrap">
          <div class="breadcrumb">PC 零件估價 <span>→</span> <strong id="activeCategoryName">分類</strong></div>
          <h2 id="catalogTitle">商品</h2>
        </div>
        <label class="mobile-category">
          <span>商品分類</span>
          <select id="categorySelect" aria-label="商品分類"></select>
        </label>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="搜尋型號、規格、品牌…（空格 = AND）" autocomplete="off" />
        <input id="minPrice" type="number" min="0" placeholder="最低價" />
        <input id="maxPrice" type="number" min="0" placeholder="最高價" />
        <select id="brandFilter" aria-label="品牌"><option value="">全部品牌</option></select>
        <select id="subFilter" aria-label="子分類"><option value="">全部子分類</option></select>
        <select id="sort" aria-label="排序">
          <option value="source">原始順序</option>
          <option value="price-asc">價格低 → 高</option>
          <option value="price-desc">價格高 → 低</option>
          <option value="name">名稱 A → Z</option>
        </select>
        <button id="resetFilters" class="ghost">重設篩選</button>
      </div>

      <div class="result-summary">
        <div class="result-summary-left">
          <strong id="resultCount">0 項</strong>
          <label class="compat-toggle" title="只隱藏已能從結構化規格確認為衝突的商品" hidden>
            <input id="compatibleOnly" type="checkbox" checked aria-label="只看相容商品" />
            <span>只看相容</span>
          </label>
        </div>
        <button id="backToCatalogTop" class="back-to-top" type="button" aria-label="回到商品第一筆" aria-hidden="true" tabindex="-1">
          <span aria-hidden="true">↑</span>
          <span>回到第一筆</span>
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>品牌</th><th>名稱</th><th>子分類</th><th class="price">價格</th><th>選擇</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>沒有符合目前條件的商品。</div>
    </section>

    <aside class="build panel">
      <div class="build-head">
        <div>
          <div class="eyebrow">CURRENT BUILD</div>
          <h2>目前配單 <span class="build-count" id="buildCount">(0)</span></h2>
        </div>
        <button id="clearBuild" class="ghost danger">清空全部</button>
      </div>
      <div id="buildItems" class="build-items"></div>
      <div class="total">
        <div><span>總計</span><small id="totalItems">0 項</small></div>
        <strong id="totalPrice">$0</strong>
      </div>
      <div class="build-manage-actions">
        <button id="saveBuildSnapshot" type="button">暫存配單</button>
        <button id="newBuild" type="button" class="secondary">開新配單</button>
      </div>
      <details class="saved-builds" id="savedBuildsPanel">
        <summary>我的暫存配單 <span class="saved-build-count" id="savedBuildCount">(0)</span></summary>
        <div class="saved-build-items" id="savedBuildItems"></div>
      </details>
      <div class="build-actions">
        <button id="copyBuild">複製文字</button>
        <button id="exportBuild" class="secondary">匯出 JSON</button>
      </div>
      <p class="source-note">獨立第三方工具，與原價屋 CoolPC 無隸屬、授權或合作關係。商品、價格、庫存、規格與相容性僅供參考，實際資訊請以原價屋與原廠當下資料為準。</p>
    </aside>
  </main>

  <script src="data/products.js"></script>
  <script src="app.js"></script>
  <script src="saved-builds.js"></script>
  <script>
    document.addEventListener('click', event => {
      const row = event.target.closest('#rows tr');
      if (!row || event.target.closest('.row-add')) return;

      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !selection.toString().trim()) return;

      for (let index = 0; index < selection.rangeCount; index += 1) {
        if (selection.getRangeAt(index).intersectsNode(row)) {
          event.stopImmediatePropagation();
          return;
        }
      }
    }, true);
  </script>
  <script src="back-to-top.js"></script>
  <script src="mobile-build.js"></script>
</body>
</html>
