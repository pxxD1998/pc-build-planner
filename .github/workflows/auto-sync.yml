name: Auto Sync PC Build Planner

on:
  push:
    branches:
      - main
    # Workflow maintenance pushes also perform an immediate no-refresh source sync.
    # Archive verification 2026-09-10: verify refresh-resilient storage regression without a CoolPC refresh.
    paths:
      - ".github/workflows/auto-sync.yml"
  schedule:
    # Hourly source sync. This does NOT fetch CoolPC.
    - cron: "47 * * * *"
    # Four catalog refreshes per day. Each refresh performs one CoolPC GET.
    - cron: "17 */6 * * *"
    # Monthly repository-activity heartbeat. Public-repo scheduled workflows can
    # be disabled by GitHub after 60 days without repository activity.
    - cron: "23 3 1 * *"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Fetch one fresh CoolPC catalog before publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pc-build-planner-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check automation credential
        id: auth
        env:
          AUTOMATION_TOKEN: ${{ secrets.PC_BUILD_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PC_BUILD_AUTOMATION_TOKEN is not configured yet; automatic sync is intentionally skipped."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout public deployment repository
        if: steps.auth.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: pxxD1998/pc-build-planner
          ref: main
          token: ${{ secrets.PC_BUILD_AUTOMATION_TOKEN }}
          path: public-repo
          fetch-depth: 1

      - name: Checkout private source of truth
        if: steps.auth.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: pxxD1998/_pxxD
          ref: coolpc-mirror-v0.1.0
          token: ${{ secrets.PC_BUILD_AUTOMATION_TOKEN }}
          path: private-source
          fetch-depth: 1

      - name: Set up Python
        if: steps.auth.outputs.enabled == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify private source tests
        if: steps.auth.outputs.enabled == 'true'
        working-directory: private-source/coolpc-mirror
        run: python -m unittest discover -s tests -v

      - name: Decide whether this run refreshes upstream data
        if: steps.auth.outputs.enabled == 'true'
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_REFRESH: ${{ inputs.refresh_data }}
        shell: bash
        run: |
          refresh=false
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_EXPR" = "17 */6 * * *" ]; then
            refresh=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_REFRESH" = "true" ]; then
            refresh=true
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "Refresh upstream catalog: $refresh"

      - name: Fetch once and derive all CoolPC catalog layers
        if: steps.auth.outputs.enabled == 'true' && steps.mode.outputs.refresh == 'true'
        working-directory: private-source/coolpc-mirror
        shell: bash
        run: |
          python scraper.py --save-html /tmp/coolpc-evaluate.html
          python tools/preserve_catalog_semantics.py --html /tmp/coolpc-evaluate.html --data-dir site/data
          python tools/build_price_history.py --products site/data/products.json --history-dir site/data/history --data-dir site/data

      - name: Commit private generated data when stable catalog content changed
        if: steps.auth.outputs.enabled == 'true' && steps.mode.outputs.refresh == 'true'
        working-directory: private-source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            coolpc-mirror/site/data/products.csv \
            coolpc-mirror/site/data/catalog-semantics.json \
            coolpc-mirror/site/data/catalog-semantics.js \
            coolpc-mirror/site/data/price-history.json \
            coolpc-mirror/site/data/price-history.js

          if git diff --cached --quiet -- \
            coolpc-mirror/site/data/products.csv \
            coolpc-mirror/site/data/catalog-semantics.json \
            coolpc-mirror/site/data/catalog-semantics.js \
            coolpc-mirror/site/data/price-history.json \
            coolpc-mirror/site/data/price-history.js; then
            git restore -- \
              coolpc-mirror/site/data/products.json \
              coolpc-mirror/site/data/products.csv \
              coolpc-mirror/site/data/products.js
            echo "No private product, source-semantic, or price-history changes"
          else
            if git diff --cached --quiet -- coolpc-mirror/site/data/products.csv; then
              git restore --staged -- coolpc-mirror/site/data/products.csv || true
              git restore -- \
                coolpc-mirror/site/data/products.json \
                coolpc-mirror/site/data/products.csv \
                coolpc-mirror/site/data/products.js
            else
              git add \
                coolpc-mirror/site/data/products.json \
                coolpc-mirror/site/data/products.js \
                coolpc-mirror/site/data/history
            fi
            git commit -m "data: refresh CoolPC catalog fidelity"
            git push origin HEAD:coolpc-mirror-v0.1.0
          fi

      - name: Rebuild snapshot price history without network
        if: steps.auth.outputs.enabled == 'true'
        working-directory: private-source/coolpc-mirror
        shell: bash
        run: |
          python tools/build_price_history.py --products site/data/products.json --history-dir site/data/history --data-dir site/data
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('site/data/price-history.json').read_text(encoding='utf-8'))
          assert payload.get('schema_version') == 2, payload.get('schema_version')
          assert payload.get('identity') == 'exact_fingerprint_v2', payload.get('identity')
          print({'price_history_schema': payload['schema_version'], 'identity': payload['identity'], 'annotations': len(payload.get('annotations') or {})})
          PY

      - name: Verify structured snapshot consistency
        if: steps.auth.outputs.enabled == 'true'
        working-directory: private-source/coolpc-mirror
        shell: bash
        run: |
          python tools/audit_motherboard_specs.py --show 20
          python tools/audit_ssd_specs.py --strict --show 20
          python tools/audit_hdd_specs.py --strict --show 20
          python tools/audit_psu_specs.py --strict --show 20
          python tools/audit_case_drive_specs.py --strict --compare-stored --show 20

      - name: Build sanitized public site
        if: steps.auth.outputs.enabled == 'true'
        working-directory: private-source/coolpc-mirror
        shell: bash
        run: python tools/build_public_site.py --output "${{ github.workspace }}/public-repo"

      - name: Verify public Build Model v2 assets
        if: steps.auth.outputs.enabled == 'true'
        working-directory: public-repo
        shell: bash
        run: |
          test -f build-model-v2.css
          grep -Fq 'href="build-model-v2.css"' index.html
          grep -Fq 'const BUILD_SCHEMA_VERSION = 2;' app.js
          grep -Fq "new Set(['7', '8'])" app.js
          grep -Fq "'pc-build-planner-build'" app.js
          grep -Fq 'data-qty-action="plus"' app.js
          grep -Fq 'schema_version: BUILD_SCHEMA_VERSION' saved-builds.js
          if grep -Fq "'coolpc-mirror-build'" app.js; then
            echo "Private build namespace leaked into public app.js" >&2
            exit 1
          fi

      - name: Verify public catalog fidelity assets
        if: steps.auth.outputs.enabled == 'true'
        working-directory: public-repo
        shell: bash
        run: |
          set -euo pipefail
          test -f catalog-fidelity.css
          test -f catalog-fidelity.js
          grep -Fq 'href="catalog-fidelity.css"' index.html
          grep -Fq 'src="catalog-fidelity.js"' index.html
          grep -Fq 'price-history-route' catalog-fidelity.js
          grep -Fq 'catalog-group-row' catalog-fidelity.js
          grep -Fq 'COOLPC_PRICE_HISTORY' catalog-fidelity.js
          if grep -Fq 'data/catalog-semantics.js' index.html; then
            echo "Private catalog semantics sidecar leaked into public index" >&2
            exit 1
          fi
          if grep -Fq 'data/price-history.js' index.html; then
            echo "Private price history sidecar leaked into public index" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path('data/products.js').read_text(encoding='utf-8')
          prefix = 'window.COOLPC_DATA = '
          assert raw.startswith(prefix)
          payload = json.loads(raw[len(prefix):].removesuffix(';\n'))
          serialized = json.dumps(payload, ensure_ascii=False)
          for forbidden in ('source_value', 'raw_text', 'source_css_class', 'manufacturer_url', 'retrieved_at', 'adapter_version'):
              assert forbidden not in serialized, forbidden
          for product in payload['products']:
              change = product.get('price_change')
              if change:
                  assert change['direction'] in ('up', 'down')
                  assert change['current_price'] == product['price']
                  assert change['delta'] == change['current_price'] - change['previous_price']
                  assert change['provenance'] == 'snapshot'
          print({'products': len(payload['products']), 'price_changes': sum(bool(p.get('price_change')) for p in payload['products'])})
          PY

      - name: Verify public storage-fit assets
        if: steps.auth.outputs.enabled == 'true'
        working-directory: public-repo
        shell: bash
        run: |
          set -euo pipefail
          test -f storage-fit.css
          test -f storage-fit.js
          grep -Fq 'href="storage-fit.css"' index.html
          grep -Fq 'src="storage-fit.js"' index.html
          grep -Fq 'drive_bays_combo_2_5_3_5' storage-fit.js
          grep -Fq '未列資料視為未知，不當成 0' storage-fit.js
          grep -Fq '主機板儲存連接' storage-fit.js
          grep -Fq '原廠資料未涵蓋' storage-fit.js
          grep -Fq '未涵蓋視為未知，不當成 0' storage-fit.js
          grep -Fq '原廠 M.2 ×' app.js
          grep -Fq '原廠 SATA ×' app.js
          grep -Fq '"specs_version":8' data/products.js
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path('data/products.js').read_text(encoding='utf-8')
          prefix = 'window.COOLPC_DATA = '
          assert raw.startswith(prefix)
          payload = json.loads(raw[len(prefix):].removesuffix(';\n'))
          boards = [p for p in payload['products'] if str(p.get('category_id')) == '5']
          known = []
          unknown = []
          for board in boards:
              storage = (board.get('specs') or {}).get('motherboard_storage')
              assert isinstance(storage, dict), board.get('name')
              if storage.get('state') == 'known':
                  assert isinstance(storage.get('m2_slot_count'), int)
                  assert isinstance(storage.get('sata_port_count'), int)
                  known.append(board)
              elif storage.get('state') == 'unknown':
                  assert 'm2_slot_count' not in storage
                  assert 'sata_port_count' not in storage
                  unknown.append(board)
              else:
                  raise AssertionError(storage)
          serialized = json.dumps(payload, ensure_ascii=False)
          # Generic snapshot provenance is public-safe; manufacturer provenance remains private.
          for forbidden in ('manufacturer_url', 'retrieved_at', 'adapter_version', 'source_value', 'raw_text', 'source_css_class'):
              assert forbidden not in serialized, forbidden
          print({'motherboards': len(boards), 'known': len(known), 'unknown': len(unknown)})
          PY

      - name: Publish public main when output changed
        if: steps.auth.outputs.enabled == 'true'
        working-directory: public-repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Public site already up to date"
            exit 0
          fi

          git commit -m "data: publish PC Build Planner"
          git push origin HEAD:main

      - name: Keep public scheduled workflow active
        if: steps.auth.outputs.enabled == 'true' && github.event_name == 'schedule' && github.event.schedule == '23 3 1 * *'
        working-directory: public-repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          printf 'Last scheduler heartbeat (UTC): %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/.scheduler-heartbeat
          git add .github/.scheduler-heartbeat
          git commit -m "chore: keep scheduled publishing active"
          git push origin HEAD:main
